[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "india-market-sentiment-trader"
version = "0.1.0"
description = "24/7 real-time market sentiment analyzer and trading bot for Indian NSE/BSE markets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "asyncpg>=0.29",
  "feedparser>=6.0",
  "praw>=7.7",
  "prometheus-client>=0.20",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyotp>=2.9",
  "pytz>=2024.1",
  "pyyaml>=6.0",
  "redis>=5.0",
  "structlog>=24.0",
  "vaderSentiment>=3.3.2",
  "websocket-client>=1.7",
]

[project.optional-dependencies]
finbert = ["torch>=2.0", "transformers>=4.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
sentiment-trader = "sentiment_trader.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
