services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
      POSTGRES_DB: sentiment_trader
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      CONFIG_DIR: config
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://trader:trader@timescaledb:5432/sentiment_trader
    depends_on:
      - redis
      - timescaledb
    ports:
      - "8080:8080"
      - "9090:9090"
    restart: unless-stopped

volumes:
  timescale_data:
